name: Build and Release Windows EXE

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.1 or v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Inject version from Git tag into app
        shell: pwsh
        run: |
          # Определяем версию из ручного ввода, тега релиза или git ref
          $rawTag = "${{ inputs.version }}"
          if (-not $rawTag) {
            $rawTag = "${{ github.event.release.tag_name }}"
          }
          if (-not $rawTag) {
            $rawTag = "${{ github.ref_name }}"
          }
          Write-Host "Raw tag/ref detected: $rawTag"

          # Убираем префикс 'v' (например, 'v1.0.1' -> '1.0.1')
          $cleanVer = $rawTag.TrimStart('v').Trim()

          if ($cleanVer -and $cleanVer -ne "main" -and $cleanVer -ne "master") {
            Write-Host "Injecting release version: $cleanVer"
            # 1. Записываем в version.txt
            Set-Content -Path version.txt -Value $cleanVer -Encoding UTF8

            # 2. Обновляем APP_VERSION в app_gui.py
            $code = Get-Content -Path app_gui.py -Raw -Encoding UTF8
            $code = $code -replace 'APP_VERSION = "[^"]+"', "APP_VERSION = `"$cleanVer`""
            Set-Content -Path app_gui.py -Value $code -Encoding UTF8
          } else {
            Write-Host "Using existing version from code"
          }

      - name: Build standalone EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "Journal_DOP" `
            --add-data "version.txt;." `
            --add-data "README.md;." `
            --add-data "LICENSE;." `
            app_gui.py

      - name: Verify build artifact
        run: |
          Get-ChildItem -Path dist/

      - name: Upload EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/Journal_DOP.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact for manual workflow run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Journal_DOP_Windows_EXE
          path: dist/Journal_DOP.exe
